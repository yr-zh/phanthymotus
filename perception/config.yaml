mcp_port: 15720

plugins:
  asr:
    enabled: false
    asr_model: paraformer-zh-en
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: false
      model_dir: /models/sherpa-onnx/kws
      keywords: []

  tts:
    enabled: true
    # MOSS-TTS-Nano (multilingual board): Audio Tokenizer + LM, ONNX CPU-only.
    # 48 kHz stereo codec output is lowpass-decimated to 16 kHz mono.
    backend: moss
    model_name: tts_moss_nano
    model_dir: /models/moss-tts-nano-16k
    hw_provider: cuda
    num_threads: 4
    # Builtin voice per language (matched against voice/display_name).
    # Native voice per language; ja uses Saki as requested. ru/es/fr/de/th
    # have no native builtin voice and fall back to the English voice.
    voices:
      default: "english news"
      zh: "junhao"
      ja: "saki"
    # Greedy decoding: deterministic stop (short inputs never ran to the
    # 375-frame cap under sampling), faster host-side loop, and better
    # content accuracy for the GSB judging.
    do_sample: false
    # 250 frames * 80 ms = 20 s audio ceiling as a safety cap.
    max_new_frames: 250
    text_normalize: false
    max_segment_chars: 0
    warmup: true
    warmup_async: false
    warmup_texts:
      - "你好，欢迎使用语音合成服务。"
      - "Hello, welcome to the speech synthesis service."
      - "こんにちは、音声合成へようこそ。"
    # MOSS does punctuation-driven prosody; segment pause only between sentences.
    realtime_pacing: false

  htmsg:
    enabled: false
    namespace: ""
    keyframe:
      dist_thresh: 1.0
      angle_thresh: 0.35
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []
    fps: 5
